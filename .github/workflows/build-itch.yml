name: Build MiniSpace for itch.io

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-html5:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Prepare browser build
        run: |
          mkdir itch-build
          find . -maxdepth 1 -type f \
            ! -name 'server.js' \
            ! -name 'package.json' \
            ! -name 'package-lock.json' \
            ! -name 'yarn.lock' \
            ! -name 'pnpm-lock.yaml' \
            -exec cp {} itch-build/ \;
          test -f itch-build/index.html

      - name: Create ZIP with index.html at its root
        run: |
          cd itch-build
          zip -r ../MiniSpace-itch-html5.zip .

      - name: Publish ZIP as a downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniSpace-itch-html5
          path: MiniSpace-itch-html5.zip
          if-no-files-found: error
          retention-days: 14
