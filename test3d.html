<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050a12">
<title>MiniSpace — 2.5D Flight Lab</title>
<link rel="stylesheet" href="test3d.css">
</head>
<body>
<main id="lab">
  <canvas id="space"></canvas>
  <header class="topbar">
    <a href="./" class="back">← MINI SPACE</a>
    <div class="brand"><span class="live-dot"></span> 2.5D FLIGHT LAB <small>ISOMETRIC EXPERIMENT</small></div>
    <button id="reset-camera" type="button">RESET VIEW</button>
  </header>
  <section class="hud">
    <div class="readout"><small>VESSEL</small><strong>MINING FRIGATE</strong></div>
    <div class="readout"><small>FLIGHT MODE</small><strong id="flight-status">READY</strong></div>
    <div class="readout"><small>SECTOR</small><strong>ORBITAL TEST RANGE</strong></div>
  </section>
  <div class="hint" id="hint">ISOMETRIC VIEW · WASD / ARROWS TO FLY · SCROLL TO ZOOM</div>
  <div class="touch-controls" aria-label="Touch flight controls">
    <div class="stick" id="stick"><div class="stick-knob" id="stick-knob"></div></div>
    <button id="boost" class="boost">THRUST</button>
  </div>
  <div class="bottom-left"><span class="legend"><i class="ship-key"></i> YOUR SHIP</span><span class="legend"><i class="station-key"></i> ORBITAL STATION</span></div>
  <div class="loading" id="loading">INITIALISING 3D FLIGHT SYSTEM…</div>
</main>
<script type="module" src="test3d.js"></script>
</body>
</html>
